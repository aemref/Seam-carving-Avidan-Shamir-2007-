[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seamcarving"
description = "From-scratch NumPy implementation of seam carving (Avidan & Shamir, 2007)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["numpy>=2.0", "opencv-python>=4.10", "matplotlib>=3.8", "pillow>=10.0"]

[tool.setuptools]
packages = ["seamcarving", "experiments"]

[tool.setuptools.dynamic]
version = { attr = "seamcarving.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E501"]
